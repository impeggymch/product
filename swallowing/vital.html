                            <feMergeNode in="SourceGraphic"/>

                </defs>

                        L 360 625 C 360 630, 370 630, 370 625 L 370 615

        <!-- UI Message Box for notifications -->
        <div id="notification" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mx-6 mb-6" role="alert">
            <strong class="font-bold">成功！</strong>
            <span class="block sm:inline">您的去背圖檔已開始下載。</span>
        </div>
    </div>

    <script>
        function downloadAsPNG() {
            const svgElement = document.getElementById('vital-svg');
            const notifyElement = document.getElementById('notification');
            
            // 1. Convert SVG to string
            const serializer = new XMLSerializer();
            let svgString = serializer.serializeToString(svgElement);
            
            // 2. Add namespace if missing (safeguard)
            if (!svgString.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
                svgString = svgString.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
            }

            // 3. Create a canvas element
            const canvas = document.createElement('canvas');
            // Hardcode output resolution for crisp image (matching viewBox)
            canvas.width = 800;
            canvas.height = 600;
            const ctx = canvas.getContext('2d');
            
            // Important: Do NOT fill the background with white, keep it transparent!
            
            // 4. Create an Image object from the SVG string
            const img = new Image();
            const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);
            
            img.onload = function() {
                // Draw image on canvas
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                // Free memory
                URL.revokeObjectURL(url);
                
                // 5. Convert canvas to PNG Data URL
                const pngUrl = canvas.toDataURL('image/png');
                
                // 6. Trigger download
                const downloadLink = document.createElement('a');
                downloadLink.href = pngUrl;
                downloadLink.download = '生理體徵示意圖_去背版.png';
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);

                // Show success message
                notifyElement.classList.remove('hidden');
                setTimeout(() => {
                    notifyElement.classList.add('hidden');
                }, 3000);
            };
            
            img.src = url;
        }
    </script>
